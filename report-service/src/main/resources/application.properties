spring.application.name=report-service
server.port=8087

# Shared JWT signing secret - supplied via environment variable, never hard-coded
jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Where approved, scope-filtered incident data comes from (resolved through Eureka;
# this URL is only used if dashboard-service is not registered)
report.dashboard.fallback-url=${DASHBOARD_SERVICE_URL:http://localhost:8089}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
