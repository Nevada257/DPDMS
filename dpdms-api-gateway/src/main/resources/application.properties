server.port=8080

spring.application.name=dpdms-api-gateway

# ---------------------------------------------------------------------------
# Service discovery: the gateway registers with Eureka and resolves every
# route through the registry (lb://<spring.application.name>), so services
# can move ports or run several instances without changing this file.
# ---------------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Hazard services -------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=flood-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://flood-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/floods/**

spring.cloud.gateway.server.webflux.routes[1].id=drought-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://drought-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/drought/**

spring.cloud.gateway.server.webflux.routes[2].id=fire-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://fire-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/fire-incidents/**,/api/audit/**

spring.cloud.gateway.server.webflux.routes[3].id=zoonotic-disease-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://zoonotic-disease-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/zoonotic-incidents/**,/api/audit-trails/**

spring.cloud.gateway.server.webflux.routes[4].id=mining-accident-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://mining-accident-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/mining-accidents/**

# --- Supporting services ---------------------------------------------------
spring.cloud.gateway.server.webflux.routes[5].id=auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=report-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://report-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/reports/**

spring.cloud.gateway.server.webflux.routes[7].id=alert-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://alert-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/alerts/**

spring.cloud.gateway.server.webflux.routes[8].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://dashboard-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/dashboard/**

# --- CORS for the React front end (Vite dev server) -------------------------
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Content-Disposition
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Headers

logging.level.org.springframework.cloud.gateway=INFO

management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
