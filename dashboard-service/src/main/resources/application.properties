spring.application.name=dashboard-service
server.port=8089

# Shared JWT signing secret - supplied via environment variable, never hard-coded
jwt.secret=${JWT_SECRET}

# Discovery: hazard services are located through Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Fallback URLs, used only if a hazard service is not registered in Eureka
dashboard.fallback.flood=${FLOOD_SERVICE_URL:http://localhost:8081}
dashboard.fallback.drought=${DROUGHT_SERVICE_URL:http://localhost:8082}
dashboard.fallback.fire=${FIRE_SERVICE_URL:http://localhost:8083}
dashboard.fallback.zoonotic=${ZOONOTIC_SERVICE_URL:http://localhost:8084}
dashboard.fallback.mining=${MINING_SERVICE_URL:http://localhost:8085}
# How long to wait for each hazard service before reporting it as unavailable
dashboard.timeout-seconds=5

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
