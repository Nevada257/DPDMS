name: Build and test

on:
  push:
  pull_request:

jobs:
  backend:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - discovery-service
          - auth-service
          - dpdms-api-gateway
          - flood
          - drought
          - fire
          - zoonotic-disease-service
          - mining-accident-service
          - alert-service
          - dashboard-service
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-password
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -pci-password" --health-interval=5s --health-retries=20
    env:
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-secret-key-for-dpdms-tests-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Create databases used by integration tests
        run: |
          for i in $(seq 1 60); do
            mysqladmin -h127.0.0.1 -uroot -pci-password ping --silent && break
            sleep 2
          done
          for db in auth_db flood_db drought_db fire_db zoonotic_db mining_accident_db alert_db; do
            mysql -h127.0.0.1 -uroot -pci-password -e "CREATE DATABASE IF NOT EXISTS $db"
          done
      - name: Build and test
        working-directory: ${{ matrix.module }}
        run: mvn -B -ntp verify -Deureka.client.enabled=false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - working-directory: flood-frontend
        run: npm ci && npm run build
