server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/drought_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shared JWT signing secret - supplied via environment variable, never hard-coded
jwt.secret=${JWT_SECRET}

spring.application.name=drought-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
