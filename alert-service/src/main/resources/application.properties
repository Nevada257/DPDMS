spring.application.name=alert-service
server.port=8088

# --- Database (own schema) -------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alert_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Security: shared JWT secret (environment variable, never hard-coded) ---
jwt.secret=${JWT_SECRET}

# --- Discovery --------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Email (JavaMail). Leave MAIL_HOST empty to log alerts as SIMULATED ------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Gmail and most providers require the sender to be the signed-in account
alerts.mail.from=${MAIL_FROM:${MAIL_USERNAME:dpdms-alerts@localhost}}

# --- WhatsApp Business Cloud API. Leave WHATSAPP_TOKEN empty to simulate ------
alerts.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v21.0}
alerts.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
alerts.whatsapp.token=${WHATSAPP_TOKEN:}
# Sent instead of free text when the recipient has not messaged the business in 24 h
alerts.whatsapp.fallback-template=${WHATSAPP_TEMPLATE:hello_world}
alerts.whatsapp.fallback-language=${WHATSAPP_TEMPLATE_LANG:en_US}

# --- WhatsApp through Green API (green-api.com). When all three are set, Green API
# is used instead of the Meta Cloud API. Values from the Green API console.
alerts.greenapi.api-url=${GREENAPI_API_URL:}
alerts.greenapi.id-instance=${GREENAPI_ID_INSTANCE:}
alerts.greenapi.api-token=${GREENAPI_API_TOKEN:}

# --- Delivery retries ---------------------------------------------------------
alerts.retry.max-attempts=3
alerts.retry.backoff-ms=2000

# --- Alerting criteria (tunable without code changes) -----------------------
alerts.rules.flood-danger-level-m=${FLOOD_DANGER_LEVEL_M:3.0}
alerts.rules.drought-crop-failure-pct=${DROUGHT_CROP_FAILURE_PCT:50}

# --- Demo subscriber seeded on first start ---------------------------------
alerts.seed.name=Provincial Duty Officer
alerts.seed.email=${ALERT_DEMO_EMAIL:duty.officer@example.org}
alerts.seed.phone=${ALERT_DEMO_PHONE:+263770000000}

# --- Observability / docs ----------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
